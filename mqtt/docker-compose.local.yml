services:
  mqtt:
    ports:
      - '1883:1883'
    volumes:
      - ./config/mosquitto.local.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'mosquitto_sub -h localhost -p 1883 -t "$$SYS/broker/uptime" -C 1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
