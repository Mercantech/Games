# Internt på dokploy-network (Bomberman-bridge). Ikke eksponer 1883 mod internet.
listener 1883
protocol mqtt
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

max_keepalive 120

# Eksterne Oplà-pads: MQTTS på games-mqtt.mercantec.tech:8883
# Aktivér når cert + passwords er på plads (se mqtt/README.md):
# listener 8883
# certfile /mosquitto/certs/fullchain.pem
# keyfile /mosquitto/certs/privkey.pem
# allow_anonymous false
# password_file /mosquitto/config/passwords
# acl_file /mosquitto/config/acl
