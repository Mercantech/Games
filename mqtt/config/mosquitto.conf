# Mercantec Games MQTT — intern 1883 på dokploy-network.
# Ekstern MQTTS (8883): games-mqtt.mercantec.tech via Traefik TCP eller broker-cert i /mosquitto/certs.

listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

max_keepalive 120
